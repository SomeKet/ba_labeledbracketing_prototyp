<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <script type="text/javascript" src="https://cdn.tiny.cloud/1/e0q0w4t1ep5f35kyxt999mzlm4ro2px179u580taztflq9sf/tinymce/7/tinymce.min.js" referrerpolicy="origin"></script>

</head>
<body>
    <h1>Bachelorprojekt - Prototype</h1>

    <div id="lecturerView">
        <h2>Lehrperson</h2>
        <div class="modisList">
            <label for="modis" style="font-size: large;">Wähle ein Bewertungsmodus:</label>
            <select name="modis" id="evaModis">
                <option value="direct-hits">Nur Volltreffer</option>
                <option value="tolerance-range">Volltreffer & Toleranzbereich</option>
                <option value="incorrect-assignment">Volltreffer & Falsche Zuweisung</option>
                <option value="all">Alle Modis</option>
            </select>
            <div class="modisSetup" style="flex-direction: row;"></div>
        </div>

        <div id="tinymce-container">
            <textarea id="lecTinyMCE">Der junge Lehrer erklärt den Schülern geduldig die Grammatik.
            </textarea>
            <!-- <textarea id="lecTinyMCE"><p>Lorem ipsum dolor sit amet, consetetur sadipscing elitr, sed diam nonumy eirmod tempor invidunt ut labore et dolore magna aliquyam erat, sed diam voluptua. At vero eos et accusam et justo duo dolores et ea rebum. Stet clita kasd gubergren, no sea takimata sanctus est Lorem ipsum dolor sit amet.
            </p>
            <p>Lorem ipsum dolor sit amet, consetetur sadipscing elitr, sed diam nonumy eirmod tempor invidunt ut labore et dolore magna aliquyam erat, sed diam voluptua. At vero eos et accusam et justo duo dolores et ea rebum. Stet clita kasd gubergren, no sea takimata sanctus est Lorem ipsum dolor sit amet.</p></textarea> -->
        </div>
        <div id="category">
            <form id="categoryForm" name="categoryForm">
                <input type="text" id="name" placeholder="Bezeichnung" name="name" required>
                <input type="text" id="label" placeholder="Label" name="label" required>
                <input type="color" id="color" value="#7fa4cc" name="color" required>
                <input type="text" id="extra" placeholder="Hinweis/Definition" name="extra" required>
                <input type="number" id="points" min="1" max="5" name="points" required>
                <button type="submit">Hinzufügen</button>
            </form>
            <div class="categoryButtons" id="lecButtons">
                <button id="deleteModeBtn" onclick="deleteModeTrigger()">Markierung löschen</button>

            </div>
            <button id="goToStudent">Start</button>
        </div>

            <div>
                <button id="dom-virtualisation">Erstelle Übersicht</button>
                <div id="treeLec" class="tree"></div>
                <div id="markierungenLec"></div>
            </div>

    </div>
    <div id="studentView" hidden>
        <h2>Student</h2>
        <div id="container">
            <div id="studentExercise" style="letter-spacing:0.1em;"></div>
            <div id="studButtons">
                <button id="deleteModeBtnStud" onclick="deleteModeTrigger()">Markierung löschen</button>
                <button id="studEingabe">FINISH</button>
        
            </div>
            <div>
                <button id="dom-virtualisationStud">Erstelle Übersicht</button>
                <div id="treeStud" class="tree"></div>
                <div id="markierungenStud"></div>
            </div>
            <div id="ergebnis"></div>
        </div>
    </div>

    
</body>
</html>
